<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alimzhan's Workshop</title>
<meta name="description" content="A manga-style portfolio: every project is a page, and the longer a project sleeps, the dustier its page gets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='2' width='26' height='28' rx='3' fill='%23ffd23f' stroke='%23111' stroke-width='3'/%3E%3Cpath d='M9 9h14M9 15h14M9 21h9' stroke='%23111' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="ambient" class="ambient" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#111"/>
    </pattern>
    <pattern id="halftone-light" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="0.9" fill="#111" opacity=".35"/>
    </pattern>
    <filter id="wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>
</svg>

<main id="stage" class="stage" aria-live="polite">
  <!-- Closed book -->
  <section id="cover" class="book-cover" role="button" tabindex="0" aria-label="Open the book">
    <div class="cover-face">
      <div class="cover-band"></div>
      <h1 class="cover-title">
        <span class="t1">THE</span>
        <span class="t2">WORKSHOP</span>
        <span class="t3">of Alimzhan</span>
      </h1>
      <p class="cover-sub">a portfolio in <em>N</em> chapters</p>
      <div class="cover-art" id="cover-art"></div>
      <p class="cover-hint">▶ tap to open</p>
      <span class="cover-sfx">NEW!</span>
      <div class="cover-spine"></div>
    </div>
    <div class="cover-pages"></div>
  </section>

  <!-- Open book -->
  <section id="book" class="book" hidden>
    <div class="book-shadow"></div>
    <div class="spread" id="spread"></div>
    <button class="nav prev" id="prev" aria-label="Previous page">◀</button>
    <button class="nav next" id="next" aria-label="Next page">▶</button>
    <div class="page-counter" id="counter"></div>
    <button class="close-book" id="closeBook" title="Close the book">✕ close</button>
  </section>

  <div id="sfx-burst" class="sfx-burst" aria-hidden="true"></div>
</main>


<script src="js/scenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
